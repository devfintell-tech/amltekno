name: Günlük AML Tekno Radar Taraması & Otomatik Dağıtım

on:
  schedule:
    # Her gece saat 03:00 TSİ (00:00 UTC) otomatik çalışır
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub Actions panelinden tek tıkla manuel çalıştırma butonu

jobs:
  daily-scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # Repoya güncellenen verileri commit & push yapabilme izni

    env:
      TZ: 'Europe/Istanbul'

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js Ortamını Hazırla
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci || npm install

      - name: Canlı Veri Taraması & Çift LLM DeepSeek Analizi
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_AUTHORITIES_TOKEN: ${{ secrets.APIFY_AUTHORITIES_TOKEN }}
        run: npm run crawl

      - name: Arayüzü Derle & Cloudflare Pages Canlıya Al (aml.aitrendleri.com)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run build
          npx wrangler pages deploy dist --project-name amltekno --branch main

      - name: Günlük AML Bültenini Hazırla ve E-Posta ile Gönder
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          ALICI_MAIL: ${{ secrets.ALICI_MAIL }}
        run: npm run newsletter

      - name: Yeni Verileri ve Arşivi Git Deposuna Kaydet (Push)
        run: |
          git config --global user.name "AML Radar Bot"
          git config --global user.email "bot@aitrendleri.com"
          git add src/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Otonom Günlük AML Raporu [skip ci]" && git push)
